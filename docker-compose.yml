services:

  postgres:
    image: postgres:16-alpine
    container_name: transaction-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: transaction_user
      POSTGRES_PASSWORD: transaction_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transaction_user -d transactions"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: transaction-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: transaction-app
    restart: unless-stopped

    environment:
      APP_NAME: secure-transaction-platform
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://transaction_user:transaction_password@postgres:5432/transactions
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      LOGIN_RATE_LIMIT_REQUESTS: 5
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: 60

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  prometheus:
    image: prom/prometheus:latest
    container_name: transaction-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      - app


  grafana:
    image: grafana/grafana:13.2.2
    container_name: transaction-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus


volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

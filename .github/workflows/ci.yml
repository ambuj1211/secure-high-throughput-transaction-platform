name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: transaction_user
          POSTGRES_PASSWORD: transaction_password
          POSTGRES_DB: transactions
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U transaction_user -d transactions"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg2://transaction_user:transaction_password@localhost:5432/transactions_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      LOGIN_RATE_LIMIT_REQUESTS: 5
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database
        env:
          PGPASSWORD: transaction_password
        run: |
          psql -h localhost -U transaction_user -d postgres \
            -c "CREATE DATABASE transactions_test OWNER transaction_user;"

      - name: Run migrations
        run: alembic upgrade head

      - name: Ruff
        run: ruff check app tests

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest -q
